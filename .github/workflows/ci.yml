name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: the npm/pnpm/yarn legs fresh-resolve (only bun.lock is committed),
    # so registry drift can break installs with zero commits here. This catches it.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pm: bun, name: bun }
          - { pm: npm, name: npm }
          - { pm: yarn, name: yarn }
          - { pm: pnpm, name: pnpm 10, pnpm-version: 10 }
          - { pm: pnpm, name: pnpm 11, pnpm-version: 11 }
          # pnpm 12 is still a release candidate, so it needs the dist tag.
          # Swap this for "12" once 12.0.0 ships.
          - { pm: pnpm, name: pnpm 12, pnpm-version: next-12 }
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        if: matrix.pm == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        if: matrix.pm != 'bun'
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        if: matrix.pm == 'pnpm'
        uses: pnpm/action-setup@v6
        with:
          version: ${{ matrix.pnpm-version }}
          run_install: false

      - name: Install
        run: ${{ matrix.pm }} install

      - name: Typecheck
        run: ${{ matrix.pm }} run typecheck

      - name: Lint
        run: ${{ matrix.pm }} run lint

      - name: Format check
        run: ${{ matrix.pm }} run fmt:check

      - name: Test
        run: ${{ matrix.pm }} run test

      - name: Build
        run: ${{ matrix.pm }} run build
